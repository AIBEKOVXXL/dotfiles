general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/wallpaper.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# Время
label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = JetBrains Mono
    color = rgb(0, 229, 255)
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 229, 255, 0.6)
    position = 0, 140
    halign = center
    valign = center
}

# Дата
label {
    monitor =
    text = cmd[update:60000] date +"%A  ·  %d.%m.%Y"
    font_size = 18
    font_family = JetBrains Mono
    color = rgba(184, 244, 255, 0.8)
    position = 0, 50
    halign = center
    valign = center
}

# Приветствие
label {
    monitor =
    text = WELCOME BACK, $USER
    font_size = 13
    font_family = JetBrains Mono
    color = rgba(0, 229, 255, 0.7)
    position = 0, -40
    halign = center
    valign = center
}

# Поле пароля
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    rounding = 4
    outer_color = rgba(00e5ffee) rgba(0066ffee) 45deg
    inner_color = rgba(5, 15, 30, 0.7)
    font_color = rgb(0, 229, 255)
    check_color = rgb(0, 255, 163)
    fail_color = rgb(255, 77, 109)
    placeholder_text = ACCESS CODE
    fail_text = ACCESS DENIED ($ATTEMPTS)
    position = 0, -110
    halign = center
    valign = center
}

# Раскладка
label {
    monitor =
    text = $LAYOUT[EN,RU]
    font_size = 12
    font_family = JetBrains Mono
    color = rgba(0, 229, 255, 0.6)
    position = 0, -170
    halign = center
    valign = center
}
